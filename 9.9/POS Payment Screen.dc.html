@media (prefers-reduced-motion:reduce){[data-blob]{animation:none !important}}
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:1600},&quot;language&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;es&quot;,&quot;en&quot;],&quot;default&quot;:&quot;es&quot;,&quot;tsType&quot;:&quot;\&quot;es\&quot; | \&quot;en\&quot;&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;amount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;45,25€&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;revealDelayMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2000,&quot;min&quot;:0,&quot;max&quot;:6000,&quot;step&quot;:250,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;autoApprove&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}">
const COPY = {
  es: {
    headline: "Acerca la tarjeta a la parte superior del dispositivo",
    reading: "Leyendo tarjeta\u2026",
    other: "Otros m\u00e9todos de pago",
    scan: "Escanea el c\u00f3digo con tu aplicaci\u00f3n",
    waiting: "Esperando confirmaci\u00f3n\u2026",
    cancel: "Cancelar",
    approved: "Pago aceptado",
    remove: "Puede retirar la tarjeta",
    restart: "toca para iniciar otra operaci\u00f3n",
    more: ["MB Way", "Twint", "Klarna", "Satispay"]
  },
  en: {
    headline: "Tap card at the top of the device",
    reading: "Reading card\u2026",
    other: "Other payment methods",
    scan: "Scan the code with your app",
    waiting: "Waiting for confirmation\u2026",
    cancel: "Cancel",
    approved: "Payment approved",
    remove: "You can remove your card",
    restart: "tap to start a new transaction",
    more: ["MB Way", "Twint", "Klarna", "Satispay"]
  }
};

class Component extends DCLogic {
  state = { screen: "tap", sheetOpen: false, moreOpen: false, method: null };
  timers = [];

  componentDidMount() { this.scheduleReveal(); }
  componentWillUnmount() { this.clear(); }
  componentDidUpdate(prev) {
    if (prev.revealDelayMs !== this.props.revealDelayMs && this.state.screen === "tap" && !this.state.sheetOpen) {
      this.clear();
      this.scheduleReveal();
    }
  }

  clear() { this.timers.forEach(clearTimeout); this.timers = []; }
  after(ms, fn) { this.timers.push(setTimeout(fn, ms)); }

  scheduleReveal() {
    const d = this.props.revealDelayMs ?? 2000;
    this.after(d, () => this.setState({ sheetOpen: true }));
  }

  tapCard = () => {
    if (this.state.screen !== "tap") return;
    this.clear();
    this.setState({ screen: "reading", sheetOpen: false, moreOpen: false });
    this.after(1700, () => this.setState({ screen: "approved" }));
  };

  pick = (label, key) => () => {
    this.clear();
    this.setState({ screen: "method", method: { label, key } });
    if (this.props.autoApprove !== false) this.after(4200, () => this.setState({ screen: "approved" }));
  };

  cancel = () => {
    this.clear();
    this.setState({ screen: "tap", sheetOpen: true, method: null });
  };

  restart = () => {
    this.clear();
    this.setState({ screen: "tap", sheetOpen: false, moreOpen: false, method: null });
    this.scheduleReveal();
  };

  renderVals() {
    const t0 = COPY[this.props.language === "en" ? "en" : "es"];
    const s = this.state.screen;
    const t = Object.assign({}, t0, { headline: s === "reading" ? t0.reading : t0.headline });
    return {
      t,
      amount: this.props.amount ?? "45,25\u20ac",
      showMain: s === "tap" || s === "reading",
      showNfc: s === "tap",
      showSpinner: s === "reading",
      showRipple: s === "reading",
      showMethod: s === "method",
      showApproved: s === "approved",
      sheetOpen: this.state.sheetOpen,
      moreOpen: this.state.moreOpen,
      dotsRotation: this.state.moreOpen ? 90 : 0,
      methodLabel: this.state.method ? this.state.method.label : "",
      isBizum: this.state.method ? this.state.method.key === "bizum" : false,
      isAlipay: this.state.method ? this.state.method.key === "alipay" : false,
      isWero: this.state.method ? this.state.method.key === "wero" : false,
      isPaypal: this.state.method ? this.state.method.key === "paypal" : false,
      isWechat: this.state.method ? this.state.method.key === "wechat" : false,
      isOther: this.state.method ? this.state.method.key === "other" : false,
      moreMethods: t.more.map((label) => ({ label, onSelect: this.pick(label, "other") })),
      onTap: this.tapCard,
      onCancel: this.cancel,
      onRestart: this.restart,
      onBizum: this.pick("Bizum", "bizum"),
      onAlipay: this.pick("Alipay", "alipay"),
      onWero: this.pick("Wero", "wero"),
      onPaypal: this.pick("PayPal", "paypal"),
      onWechat: this.pick("WeChat Pay", "wechat"),
      onToggleMore: () => this.setState((st) => ({ moreOpen: !st.moreOpen }))
    };
  }
}

</script>
</body>
</html>
