<x-dc>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0d0d10}
a{color:rgb(7,37,80)}a:hover{color:rgb(98,118,155)}
@keyframes dropUp{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

</helmet>
<div style="position:relative;width:720px;height:1600px;overflow:hidden;background-color:rgb(243,246,254);font-family:Inter,system-ui,sans-serif;color:rgb(7,37,80);user-select:none;-webkit-font-smoothing:antialiased">

  <sc-if value="{{ onCharge }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0">

      <div style="position:absolute;left:60px;top:290px;width:600px;display:flex;flex-direction:column;align-items:center;gap:24px">
        <span style="font-weight:700;font-size:49.1949px;line-height:1.5;white-space:nowrap">{{ t.enterAmount }}</span>
        <span style="font-weight:800;font-size:104px;line-height:1.2;white-space:nowrap">{{ display }}</span>
      </div>

      <div style="position:absolute;left:60px;top:735px;width:600px;display:grid;grid-template-columns:repeat(3,188px);grid-auto-rows:107px;gap:24px 17px">
        <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
          <div onClick="{{ k.onPress }}" style="border-radius:20.1619px;background:rgb(255,255,255);box-shadow:inset 0 0 0 1.26px rgb(231,236,245),0px 4px 4px 0px rgba(11,48,100,0.05);display:flex;align-items:center;justify-content:center;transition:transform .12s ease,background .12s ease;cursor:{{ k.cursor }}">
            <sc-if value="{{ k.isInert }}">
              <span style="font-weight:800;font-size:44px;line-height:1;color:rgb(98,118,155)">{{ k.label }}</span>
            </sc-if>
            <sc-if value="{{ k.isDigit }}" hint-placeholder-val="{{ true }}">
              <span style="font-weight:800;font-size:44px;line-height:1">{{ k.label }}</span>
            </sc-if>
            <sc-if value="{{ k.isBack }}">
              <svg width="42" height="32" viewBox="0 0 42 32" fill="none">
                <path d="M14 3H38C39.657 3 41 4.343 41 6V26C41 27.657 39.657 29 38 29H14L1 16L14 3Z" fill="rgb(7,37,80)"></path>
                <path d="M20 11L30 21M30 11L20 21" stroke="rgb(255,255,255)" stroke-width="3" stroke-linecap="round"></path>
              </svg>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="position:absolute;left:60px;top:1304px;width:600px;height:90px;display:flex;flex-direction:row;gap:15px;align-items:stretch">
        <div onClick="{{ onContinue }}" style="flex:1;border-radius:20.1619px;background:{{ continueBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .14s ease" style-active="transform:scale(.99)">
          <span style="font-weight:600;font-size:28px;color:rgb(255,255,255)">{{ t.continue }}</span>
        </div>
        <div onClick="{{ onToggleTools }}" style="width:86px;border-radius:20.1619px;background:rgb(255,255,255);box-shadow:inset 0 0 0 1.26px rgb(231,236,245),0px 4px 4px 0px rgba(11,48,100,0.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .14s ease,background .14s ease" style-active="transform:scale(.97);background:rgb(237,242,252)">
          <div style="width:7px;height:7px;border-radius:50%;background:rgb(7,37,80)"></div>
          <div style="width:7px;height:7px;border-radius:50%;background:rgb(7,37,80)"></div>
          <div style="width:7px;height:7px;border-radius:50%;background:rgb(7,37,80)"></div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ onManage }}">
    <div style="position:absolute;left:0;top:0;width:720px;height:1441px;overflow:hidden;animation:fadeIn .2s ease both">
      <div style="position:absolute;left:60px;top:96px;width:600px;display:flex;flex-direction:column;gap:8px">
        <span style="font-weight:700;font-size:49.1949px;line-height:1.3">{{ t.manage }}</span>
        <span style="font-weight:500;font-size:24px;line-height:1.5;color:rgb(98,118,155)">{{ merchant }}</span>
      </div>

      <div style="position:absolute;left:60px;top:250px;width:600px;height:1140px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:32px">

          <div style="display:flex;flex-direction:column;gap:12px">
            <span style="font-weight:600;font-size:20px;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:rgb(98,118,155)">{{ g.title }}</span>
            <div style="display:flex;flex-direction:column;gap:12px">
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
                <div onClick="{{ it.onOpen }}" style="height:104px;border-radius:20.1619px;background:rgb(255,255,255);box-shadow:inset 0 0 0 1.26px rgb(231,236,245),0px 4px 4px 0px rgba(11,48,100,0.05);display:flex;flex-direction:row;align-items:center;gap:20px;padding:0 28px;box-sizing:border-box;cursor:pointer;transition:transform .14s ease,background .14s ease" style-active="transform:scale(.995);background:rgb(248,250,255)">

                  <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
                    <span style="font-weight:600;font-size:26px;line-height:1.3">{{ it.label }}</span>
                    <span style="font-weight:500;font-size:19px;line-height:1.4;color:rgb(98,118,155)">{{ it.hint }}</span>
                  </div>

                    <path d="M2 2L11 12L2 22" stroke="rgb(98,118,155)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <div style="height:8px;flex-shrink:0"></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toolsOpen }}">
    <div onClick="{{ onToggleTools }}" style="position:absolute;inset:0;background:rgba(7,37,80,.14);animation:fadeIn .16s ease both"></div>
    <div style="position:absolute;left:60px;top:530px;width:600px;border-radius:24px;background:rgb(255,255,255);box-shadow:0px 12px 40px 0px rgba(11,48,100,.18);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;transform-origin:bottom right;animation:dropUp .26s cubic-bezier(.22,1,.36,1) both">

  const o = opts || {};

    "svg",

    paths.map((p, i) =>

    )
  );
}

class Component extends DCLogic {
  state = { tab: "charge", cents: 0, toolsOpen: false, toast: null, paying: false };
  toastTimer = null;

  componentWillUnmount() { clearTimeout(this.toastTimer); }

  flash(msg) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2200);
  }

  press = (digit) => () => {
    if (this.state.cents >= 100000000) return;
    this.setState((s) => ({ cents: s.cents * 10 + digit }));
  };

  backspace = () => this.setState((s) => ({ cents: Math.floor(s.cents / 10) }));

  format(cents) {
    const units = Math.floor(cents / 100);
    const dec = String(cents % 100).padStart(2, "0");
    return units.toLocaleString("es-ES") + "," + dec + " \u20ac";
  }

  renderVals() {
    const t = COPY[this.props.language === "en" ? "en" : "es"];
    const cents = this.state.cents;
    const tab = this.state.tab;
    const paying = this.state.paying;
    const icon = (name, size) => svg(P[name] || P.gear, { w: size || 30, h: size || 30 });

    const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    const key = (label, extra) => Object.assign({ label, isDigit: false, isBack: false, isInert: false, cursor: "pointer" }, extra);
    const keys = digits.map((d) => key(String(d), { isDigit: true, onPress: this.press(d) }));
    keys.push(key(",", { isInert: true, cursor: "default", onPress: () => {} }));
    keys.push(key("0", { isDigit: true, onPress: this.press(0) }));
    keys.push(key("", { isBack: true, onPress: this.backspace }));

    return {
      t,
      merchant: this.props.merchant ?? "Cafeter\u00eda Nou Barris \u00b7 Terminal 02",
      display: this.format(cents),
      keys,
      continueBg: cents > 0 ? "rgb(7,37,80)" : "rgba(7,37,80,.35)",
      onCharge: tab === "charge" && !paying,
      onManage: tab === "manage" && !paying,
      onPayment: paying,
      navVisible: !paying,
      toolsOpen: this.state.toolsOpen,
      toast: this.state.toast,
      toastOpen: !!this.state.toast,
      chargedAmount: this.format(cents),
      language: this.props.language === "en" ? "en" : "es",
      outcome: this.props.outcome === "ko" ? "ko" : "ok",
      chargeInk: tab === "charge" ? "rgb(7,37,80)" : "rgb(98,118,155)",
      manageInk: tab === "manage" ? "rgb(7,37,80)" : "rgb(98,118,155)",
      chargeUnderline: tab === "charge" ? "rgb(7,37,80)" : "transparent",
      manageUnderline: tab === "manage" ? "rgb(7,37,80)" : "transparent",
      tools: t.tools.map(([key, label, hint]) => ({
        label, hint, icon: icon(key, 28),
        onPick: () => { this.setState({ toolsOpen: false }); this.flash(label + " \u00b7 " + t.soon); }
      })),
      manageGroups: t.groups.map(([title, items]) => ({
        title,
        items: items.map(([key, label, hint]) => ({
          label, hint, icon: icon(key, 30),
          onOpen: () => this.flash(label + " \u00b7 " + t.soon)
        }))
      })),
      onToggleTools: () => this.setState((s) => ({ toolsOpen: !s.toolsOpen })),
      onContinue: () => {
        if (this.state.cents <= 0) { this.flash(t.needAmount); return; }
        this.setState({ paying: true, toolsOpen: false, toast: null });
      },
      goCharge: () => this.setState({ tab: "charge", paying: false, toolsOpen: false }),
      onPaymentDone: () => this.setState({ tab: "charge", paying: false, toolsOpen: false, cents: 0, toast: null }),
      goManage: () => this.setState({ tab: "manage", paying: false, toolsOpen: false })
    };
  }
}

</script>
</body>
</html>
